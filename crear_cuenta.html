<!--Estilos aplicados por Ciro E. Rivera-->
<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Crear Cuenta</title>
        <link rel="stylesheet" href="/styles/estilo1.css" />
        <link rel="stylesheet" href="/styles/forms.css" />
    </head>
    <body>
        <header class="barra">
            <div class="logo"><a href="index.html">AZUU</a></div>
            <nav class="menu">
                <a href="explorar.html">Explorar</a>
                <a href="resenas.html">Reseñas</a>
                <a href="mi_lista.html">Mi lista</a>
            </nav>
            <div class="buscador">
                <input type="text" placeholder="Buscar libros..." />
                <a href="login.html" class="perfil">
                    <img src="Recursos/1.png" alt="Perfil" />
                </a>
            </div>
        </header>

        <div class="contenedor-formulario">
            <h1>Crear Nueva Cuenta</h1>
            <form>
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required />
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <div class="form-group">
                    <label for="usuario">Nombre de Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required />
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required />
                </div>

                <div class="form-group">
                    <label for="confirmar_password">Confirmar Contraseña:</label>
                    <input type="password" id="confirmar_password" name="confirmar_password" required />
                </div>

                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar</button>
            </form>

            <div class="enlaces-formulario">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>

        <footer>
            <h4>Contacto</h4>
            <p>Email: <a href="mailto:biblioteca@azuu.com">biblioteca@azuu.com</a></p>
            <p>Teléfono: +57 300 123 4567</p>
            <p><a href="contacto.html">Ver más información de contacto</a></p>
            <p style="margin-top: 18px">&copy; 2026 AZUU Biblioteca Digital. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
